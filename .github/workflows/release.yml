name: release

# Tag and push to cut a release:  git tag v1.0.0 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          # There is no go.sum - the module has no dependencies - and setup-go
          # warns on every run when it cannot find one to key the cache on.
          cache: false

      # Asset names carry no version, so the /releases/latest/download/ URLs
      # in the README keep working across releases.
      - name: Build tarballs
        run: |
          set -eux
          for arch in arm64 amd64; do
            out="dist/gomon-linux-$arch"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags='-s -w' -o "$out/gomon" .
            cp gomon.service gomonctl install.sh "$out/"
            tar -C dist -czf "dist/gomon-linux-$arch.tar.gz" "gomon-linux-$arch"
          done
          ls -l dist/*.tar.gz

      # Tag push publishes; a manual run is a dry run that just keeps the
      # tarballs as run artifacts, so the build can be checked without
      # cutting a release.
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Upload tarballs (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: gomon-tarballs
          path: dist/*.tar.gz
